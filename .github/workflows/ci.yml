name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          check-latest: true
      - run: go build ./...
      - run: go vet ./...
      # Full test suite is ubuntu-only: the engine's policy semantics are
      # POSIX-shell-native by design (planes evaluate bash-style commands), so
      # Windows-host path assumptions (IsAbs, HOME vs USERPROFILE, XDG vs
      # LOCALAPPDATA) fail there. Windows coverage = build + vet; windows
      # binaries remain a first-class RELEASE artifact.
      - name: test
        if: matrix.os == 'ubuntu-latest'
        run: go test ./...
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
