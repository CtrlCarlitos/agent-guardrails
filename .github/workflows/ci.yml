name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go build ./...
      - run: go vet ./...
      # Full test suite is ubuntu-only: the engine's policy semantics are
      # POSIX-shell-native by design (planes evaluate bash-style commands), so
      # Windows-host path assumptions (IsAbs, HOME vs USERPROFILE, XDG vs
      # LOCALAPPDATA) fail there. Windows coverage = build + vet; windows
      # binaries remain a first-class RELEASE artifact.
      - name: sow stray temp-root repo
        # Regression guard for the temp-root discovery boundary (ADR: the
        # /tmp/.git lesson): an empty .git at the system temp root must not
        # capture repo-target resolution. Sow it before every test run so a
        # regression fails here, not on a developer machine.
        if: matrix.os != 'windows-latest'
        run: mkdir /tmp/.git
      - name: test
        if: matrix.os != 'windows-latest'
        run: go test ./...
      - name: windows-shaped tests
        # The Claude plane's Windows validation sheet: backslash payloads
        # through the adapter and Engine, BOM-tolerant settings reads, the
        # bundle resolver's launcher fallback, and the Windows selftest
        # probes through the real hook path. Named so the POSIX-native
        # engine suite stays out of this job. The egress tests exercise the
        # Windows allowance-journal ACLs (ADR-0021 step c); the brokered
        # web-host action tests stay out until the step (d) gates lift.
        # The package list and the filter are asserted against this line by
        # TestWindowsSelectedTestsLiveInPackagesTheWindowsJobRuns and
        # TestWindowsNamedTestFilesAreSelectedByTheWindowsJob: a Windows test
        # is invisible here unless its name matches AND its package is listed,
        # and both halves have been missed before. Add the package when you add
        # the test.
        if: matrix.os == 'windows-latest'
        run: go test ./internal/adapter/ ./internal/engine/ ./internal/genconfig/ ./internal/coverage/ ./internal/policy/ ./internal/approval/ ./internal/operatorauth/ ./internal/privatefs/ ./internal/testenv/ ./cmd/guardrail/ ./test/ -run 'Windows|BOM|ReadJSONObject|TestDefaultDaemon|Egress|Allowance'
      - name: windows portable approval and policy suites
        # These packages use host-native repository paths, named pipes, ACLs,
        # and connection errors. Run every assertion rather than relying on
        # the selected-test name filter above.
        if: matrix.os == 'windows-latest'
        run: go test ./internal/approval/ ./internal/policy/
      - name: windows portable hook tracking fixtures
        # These assertions use host-native repository coordinates and must run
        # on Windows as well as the POSIX hosts.
        if: matrix.os == 'windows-latest'
        run: go test ./cmd/guardrail/ -run 'Test(Trifecta|TrackingUnavailable|HookHashesNativeSessionID)'
      - name: windows portable hook night fixtures
        # Exercise the complete night-mode hook and broker assertion family
        # with host-native repository coordinates.
        if: matrix.os == 'windows-latest'
        run: go test ./cmd/guardrail/ -run 'Test(Hook.*Night|Night)'
      - name: windows portable OpenCode binary path fixtures
        if: matrix.os == 'windows-latest'
        run: go test ./cmd/guardrail/ -run 'Test(GenConfig|Sync)OpencodeBakesAbsoluteBinary'
      - name: windows portable executable path fixtures
        if: matrix.os == 'windows-latest'
        run: go test ./internal/testenv/ ./internal/coverage/ ./cmd/guardrail/ -run 'Test(PathListRoundTripsHostileExecutableDirectory|ClaudeBundlePathResolvesSymlinkOnPATH|ClaudeDriftScansOnceThenAnswersFromCache|GenConfigOpencodeResolvesBareBinaryFromPATH|SyncOpencodeResolvesBareBinaryFromPATH|SyncMixedPlanesResolveBinaryOnlyForOpencode|HookSessionStartReportsCoverageDriftOnce)'
      - name: windows portable sanitized path fixtures
        # Expected diagnostics follow the host-native rendering of the real
        # hostile-path fixtures while preserving the full sanitization checks.
        if: matrix.os == 'windows-latest'
        run: go test ./cmd/guardrail/ -run 'Test(DoctorDoesNotTruncatePolicyWarningDispositions|DoctorSanitizesOperatorConfigError|DoctorShowsEveryPolicyWarningOnceInMergeOrder|HookSessionStartSanitizesOperatorConfigLoadError)'
      - name: windows portable adapter suite
        # Codex envelopes use host-absolute working directories, so every
        # capability and fail-closed assertion can run on Windows.
        if: matrix.os == 'windows-latest'
        run: go test ./internal/adapter/
      - name: gofmt
        if: matrix.os != 'windows-latest'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
