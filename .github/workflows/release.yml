name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Build-provenance attestation: a release binary can be checked against the
  # workflow run that built it (`gh attestation verify`), not just against a
  # SHA256SUMS file that lives in the same release.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Build release artifacts
        env:
          VERSION: ${{ github.ref_name }}
        run: ./scripts/build-dist.sh
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/guardrail_*
            dist/install.sh
            dist/install.ps1
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          # The tag name reaches the shell as data, never as script text.
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            dist/guardrail_* dist/install.sh dist/install.ps1 dist/SHA256SUMS
