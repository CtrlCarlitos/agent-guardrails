# The shipped Base policy. Universal rules only — anything project-specific
# belongs in a repo's guardrail.toml Overlay.
unknown_tool_posture = "audit"

[slots]
safe_roots       = []
egress_allowlist = []
audit_log        = ""

# Every glob is matched against the full path; "**/" means "at any depth".
# There is no basename fallback (review M-2/M-4/M-5), so a bare name here would
# match only a path that is exactly that name.
secret_dirs = [
  "**/.ssh/**", "/root/.ssh/**", "**/.aws/**", "**/.config/gcloud/**",
  "**/.docker/config.json", "**/.gnupg/**",
  # #435: token caches and secret stores (Azure MSAL caches, pass, 1Password CLI).
  "**/.azure/**", "**/.password-store/**", "**/.config/op/**",
]

secret_globs = [
  "**/.env", "**/.env.*",
  "**/.kube/config", "**/.netrc", "**/.npmrc", "**/.pypirc",
  "**/.git-credentials",
  "**/id_rsa*", "**/id_ed25519*", "**/id_ecdsa*", "**/id_dsa*",
  "**/*_rsa", "**/*_ed25519", "**/*_ecdsa", "**/*.private.key",
  "**/*-private-key.*", "**/private*.key", "**/.claude.json",
  # #435: credential files that were readable. gh keeps its token in
  # hosts.yml where there is no OS keyring (e.g. WSL); _netrc is the Windows
  # spelling of .netrc; the last group are the agents' own login tokens.
  "**/.config/gh/hosts.yml", "**/GitHub CLI/hosts.yml", "**/.config/hub",
  "**/_netrc", "**/.cargo/credentials", "**/.cargo/credentials.toml",
  "**/.terraform.d/credentials.tfrc.json", "**/.vault-token",
  "**/.config/fly/config.yml",
  "**/.claude/.credentials.json", "**/.codex/auth.json",
  "**/opencode/auth.json", "**/.gemini/oauth_creds.json",
]

secret_ask_globs = [
  "**/*.pem", "**/*.p12", "**/*.pfx", "**/*.keystore",
  "**/service-account*.json",
]

secret_allow = [
  "**/.env.example", "**/.env.sample", "**/*.pub",
]
