# The shipped Base policy. Universal rules only — anything project-specific
# belongs in a repo's guardrail.toml Overlay.

[slots]
safe_roots       = []
egress_allowlist = []
audit_log        = ""

# Every glob is matched against the full path; "**/" means "at any depth".
# There is no basename fallback (review M-2/M-4/M-5), so a bare name here would
# match only a path that is exactly that name.
secret_dirs = [
  "**/.ssh/**", "/root/.ssh/**", "**/.aws/**", "**/.config/gcloud/**",
  "**/.docker/config.json", "**/.gnupg/**",
]

secret_globs = [
  "**/.env", "**/.env.*",
  "**/.kube/config", "**/.netrc", "**/.npmrc", "**/.pypirc",
  "**/.git-credentials",
  "**/id_rsa*", "**/id_ed25519*", "**/id_ecdsa*", "**/id_dsa*",
  "**/*_rsa", "**/*_ed25519", "**/*_ecdsa", "**/*.private.key",
  "**/*-private-key.*", "**/private*.key", "**/.claude.json",
]

secret_ask_globs = [
  "**/*.pem", "**/*.p12", "**/*.pfx", "**/*.keystore",
  "**/service-account*.json",
]

secret_allow = [
  "**/.env.example", "**/.env.sample", "**/*.pub",
]
